<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0D0E13">
<meta name="description" content="A little magic for scattered minds. Say it once, we sort it.">
<title>Hocus Focus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&family=Nunito:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0D0E13;overscroll-behavior:none}
#hf{--bg:#0D0E13;--sf:#17181F;--ln:#23242C;--am:#FFB51F;--amd:#1A1300;--wh:#F3F3F6;--ink:#14151A;--tx:#F2F2F5;--mu:#8A8B96;--mu2:#7A7B85;--dg:#FF7A6B;position:relative;overflow:hidden;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#hf *{box-sizing:border-box}#hf p,#hf h1{margin:0}
#hf button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#hf input,#hf textarea{user-select:text}
.q{font-family:Quicksand,sans-serif;font-weight:500;letter-spacing:-.2px}
.am{color:var(--am)}.mu{color:var(--mu)}
#v{position:absolute;inset:0;display:flex;flex-direction:column}
.sc{flex:1;overflow-y:auto;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
.pd{display:flex;flex-direction:column;min-height:100%;padding:calc(env(safe-area-inset-top) + 22px) 22px 120px}
.fi{animation:fu .6s cubic-bezier(.22,1,.36,1) both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grow{flex:1}.g1{flex:1;min-width:0}
.btn{display:block;width:100%;border-radius:999px;padding:16px;font:500 15px Quicksand,sans-serif;background:var(--am);color:var(--amd);transition:transform .2s cubic-bezier(.22,1,.36,1)}
.btn:active{transform:scale(.97)}
.fld{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:11px 16px;margin-bottom:10px;transition:border-color .2s}
.fld:focus-within{border-color:var(--am)}
.fld>span{display:block;font-size:12px;color:var(--mu)}
.fld input{width:100%;background:none;border:0;outline:none;color:var(--tx);font:16px Nunito,sans-serif;padding:2px 0 0}
.err{color:var(--dg);font-size:13px;min-height:18px;margin-top:2px}
.ph{display:block;width:64px;height:64px;border-radius:50%;border:2px solid var(--am);padding:3px;flex-shrink:0;cursor:pointer}
.ph>span{width:100%;height:100%;border-radius:50%;background:var(--sf);display:flex;align-items:center;justify-content:center;color:var(--am);font-size:22px;overflow:hidden}
.pn .ph>span{background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:6px 12px;font-size:12px}
.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--wh);color:var(--ink);font-family:Quicksand,sans-serif;font-weight:500;flex-shrink:0}
.stack{position:relative}
.now{position:relative;z-index:2;background:var(--am);color:var(--amd);border-radius:26px;padding:18px}
.now .t{font-size:21px;line-height:1.2;margin-top:6px}
.now .s{font-size:13px;opacity:.75;margin-top:4px}
.now .row{display:flex;align-items:center;gap:12px}
.chk{width:50px;height:50px;border-radius:50%;background:var(--ink) !important;color:var(--am) !important;font-size:22px !important;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s}
.chk:active{transform:scale(.9)}
.later{margin-top:12px;font-size:13px !important;font-weight:500;opacity:.8;display:inline-flex;align-items:center;gap:6px}
.next{position:relative;z-index:1;background:var(--wh);color:var(--ink);border-radius:22px;margin-top:-24px;padding:34px 18px 14px;display:flex;align-items:center;gap:10px}
.tag{background:var(--am);color:var(--amd);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
.tiles{display:flex;gap:10px;margin-top:16px}
.tile{flex:1;background:var(--sf) !important;border:1px solid var(--ln) !important;border-radius:20px;padding:12px 6px !important;text-align:center;transition:border-color .2s}
.tile.on{border-color:var(--am) !important}
.tile i{font-size:20px;color:var(--am)}
.tile b{display:block;font:500 16px Quicksand,sans-serif;margin-top:4px}
.tile small{font-size:11px;color:var(--mu)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 6px;font-size:13px;color:var(--mu)}
.it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--sf)}
.ck{width:24px;height:24px;flex-shrink:0;border:1.5px solid #4A4B55 !important;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.ck.on{background:var(--am) !important;border-color:var(--am) !important;color:var(--amd)}
.it .t{font-size:15px}.it .m{font-size:12px;color:var(--mu);margin-top:2px}
.done{opacity:.45}.done .t{text-decoration:line-through}
.x{color:var(--mu) !important;font-size:18px !important;padding:4px !important}
.empty{text-align:center;color:var(--mu);font-size:14px;margin-top:20px}
.nav{position:absolute;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;gap:10px;align-items:center}
.navp{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:999px;display:flex;justify-content:space-around;padding:14px 0;font-size:20px;color:var(--mu)}
.navp .on{color:var(--am)}
.mic{width:86px;height:54px;border-radius:999px;background:var(--am) !important;color:var(--amd) !important;font-size:24px !important;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.mic:active{transform:scale(.94)}
#c{position:absolute;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .55s cubic-bezier(.22,1,.36,1);z-index:5}
#c.show{transform:none}
#ci{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 22px calc(env(safe-area-inset-bottom) + 16px)}
.top{display:flex;justify-content:space-between;align-items:center}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--mu)}
.on .ldot{background:var(--am);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.3}}
.live{font:400 21px/1.4 Quicksand,sans-serif;margin-top:22px;min-height:88px;max-height:150px;overflow-y:auto}
.live .hp{color:var(--mu)}.live b{font-weight:400;color:var(--am)}
.rings{position:relative;width:230px;height:230px;border-radius:50%;border:1px solid #1E1F27;display:flex;align-items:center;justify-content:center}
.rings::before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;border:1px solid #2A2B33}
.pulse{position:absolute;width:112px;height:112px;border-radius:50%;border:2px solid var(--am);opacity:0}
.on .pulse{animation:pl 1.8s cubic-bezier(.22,1,.36,1) infinite}.on .p2{animation-delay:.6s}
@keyframes pl{0%{transform:scale(1);opacity:.6}100%{transform:scale(2);opacity:0}}
.bigmic{position:relative;width:112px;height:112px;border-radius:50% !important;background:var(--am) !important;color:var(--amd) !important;font-size:38px !important;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.on .bigmic{transform:scale(1.06)}
.wv{display:flex;align-items:center;justify-content:center;gap:4px;height:40px;margin-top:6px}
.wv i{width:3px;border-radius:2px;background:var(--am);transform:scaleY(.15);transition:transform .2s}
.on .wv i{animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.lbl{text-align:center;font-size:13px;color:var(--mu);margin-top:10px}
.lnk{display:block;width:100%;text-align:center;font-size:13px !important;font-weight:500;color:var(--mu) !important;padding:12px !important}
.tx{width:100%;min-height:170px;margin-top:22px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:18px;color:var(--tx);font:17px Nunito,sans-serif;resize:none;outline:none}
.tx:focus{border-color:var(--am)}
.hd{background:var(--am);color:var(--amd);border-radius:26px;padding:18px}
.cards{flex:1;overflow-y:auto;margin-top:12px;scrollbar-width:none}
.card{background:var(--wh);color:var(--ink);border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ic{width:40px;height:40px;border-radius:50% !important;background:var(--ink) !important;color:var(--am) !important;font-size:18px !important;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ct{width:100%;background:none;border:0;outline:none;color:var(--ink);font:500 16px Quicksand,sans-serif;padding:0}
.cm{font-size:12px;color:var(--mu2);margin-top:2px}
.card .x{color:#9A9BA5 !important}
.bar{height:3px;background:var(--sf);border-radius:2px;margin:10px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--am);width:100%;transform-origin:left}
.tip{text-align:center;font-size:12px;color:var(--mu)}
#s{position:absolute;inset:0;z-index:8;pointer-events:none}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .4s}
.pn{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);border-radius:30px 30px 0 0;padding:14px 22px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .5s cubic-bezier(.22,1,.36,1)}
#s.show{pointer-events:auto}#s.show .bd{opacity:1}#s.show .pn{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#33343D;margin:0 auto 18px}
.sn{width:100%;background:none;border:0;outline:none;color:var(--tx);font:500 22px Quicksand,sans-serif;padding:0;text-align:center}
.stats{display:flex;gap:10px;margin:16px 0}
.stats div{flex:1;background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:10px;text-align:center}
.stats b{display:block;font:500 19px Quicksand,sans-serif;color:var(--am)}
.stats small{font-size:11px;color:var(--mu)}
.grp{background:var(--bg);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ln);font-size:14px}
.sr:last-child{border-bottom:0}
.seg{display:flex;background:var(--sf);border-radius:999px;padding:3px}
.seg button{padding:6px 12px !important;border-radius:999px;font-size:12px !important;color:var(--mu) !important}
.seg .on{background:var(--am) !important;color:var(--amd) !important;font-weight:500}
.sw{width:46px;height:28px;border-radius:999px;background:#33343D !important;position:relative;flex-shrink:0;transition:background .3s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--bg);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.sw.on{background:var(--am) !important}.sw.on::after{transform:translateX(18px)}
.rst{display:block;width:100%;text-align:center;color:var(--dg) !important;font-size:13px !important;font-weight:500;padding:14px !important;margin:6px 0 4px}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,10px);opacity:0;background:var(--wh);color:var(--ink);border-radius:999px;padding:11px 18px;font-size:13px;white-space:nowrap;transition:all .4s cubic-bezier(.22,1,.36,1);z-index:9;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#B07800 !important;font-weight:500}
#sp{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s}
#sp.hide{opacity:0;pointer-events:none}
</style>

function complete(id){const it=S.items.find(x=>x.id===id);if(!it)return;it.done=true;it.doneAt=new Date().toISOString();if(S.wins.day!==dayKey())S.wins={day:dayKey(),count:0};S.wins.count++;store.set('wins',S.wins);store.set('items',S.items);buzz([12,50,12]);toast(WINS[Math.floor(Math.random()*WINS.length)]);arm();render()}
function later(id){const it=S.items.find(x=>x.id===id);if(!it)return;it.snoozedUntil=Date.now()+3600000;store.set('items',S.items);buzz(5);toast('Moved back an hour');render()}
function del(id){const i=S.items.findIndex(x=>x.id===id);if(i<0)return;lastDel={item:S.items[i],i};S.items.splice(i,1);store.set('items',S.items);arm();render();toast('Deleted',true)}
function undo(){if(!lastDel)return;S.items.splice(lastDel.i,0,lastDel.item);lastDel=null;store.set('items',S.items);arm();render();toast('Restored')}
function paintSheet(){const p=S.profile;const total=S.items.length,doneN=S.items.filter(i=>i.done).length;
$('.pn').innerHTML=`<div class="grab"></div>
<div style="display:flex;flex-direction:column;align-items:center"><label class="ph" style="width:76px;height:76px"><span>${p.photo?`<img src="${p.photo}" alt="">`:`<span class="q" style="color:var(--am);font-size:26px">${esc(p.name.charAt(0).toUpperCase())}</span>`}</span><input id="ph2" type="file" accept="image/*" hidden></label><input id="sn" class="sn" value="${esc(p.name)}" aria-label="Your name" style="margin-top:10px"><p class="mu" style="font-size:12px;margin-top:2px">Age ${p.age} · tap photo to change</p></div>
<div class="stats"><div><b>${S.wins.count}</b><small>Wins today</small></div><div><b>${total}</b><small>Captured</small></div><div><b>${doneN}</b><small>Done</small></div></div>
<div class="grp"><div class="sr"><span>Voice</span><div class="seg">${[['en-IN','English'],['hi-IN','Hindi']].map(([k,l])=>`<button class="${S.settings.lang===k?'on':''}" data-a="lang" data-k="${k}">${l}</button>`).join('')}</div></div>
<div class="sr"><span>Open straight to capture</span><button class="sw ${S.settings.instant?'on':''}" data-a="instant" aria-label="Open straight to capture"></button></div>
<div class="sr"><span>Reminder notifications</span><button class="sw ${S.settings.notify?'on':''}" data-a="notify" aria-label="Reminder notifications"></button></div></div>
<button class="rst" data-a="reset">Start fresh</button><button class="btn" data-a="closeSheet">Done</button>`}
function readPhoto(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=240;c.width=c.height=s;const m=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.8))};img.onerror=()=>res(null);img.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
function startApp(){const n=$('#nm').value.trim(),a=parseInt($('#ag').value,10),err=$('#err');
if(!n){err.textContent='Tell us what to call you.';return}if(!a||a<5||a>120){err.textContent='Enter your age as a number.';return}
S.profile={name:n,age:a,photo:tmpPhoto||null};store.set('profile',S.profile);buzz([10,40,10]);render();setTimeout(()=>toast('Tap the mic and say anything'),700)}

app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
switch(a){
case'start':return startApp();
case'capture':return openCap('tap');
case'done':return complete(id);
case'later':return later(id);
case'del':return del(id);
case'undo':return undo();
case'filter':{const k=b.dataset.k;filter=(filter===k&&k!=='all')?'all':k;buzz(5);return render()}
case'profile':return openSheet();
case'closeSheet':return closeSheet();
case'lang':S.settings.lang=b.dataset.k;store.set('settings',S.settings);return paintSheet();
case'instant':S.settings.instant=!S.settings.instant;store.set('settings',S.settings);return paintSheet();
case'notify':(async()=>{
  if(!S.settings.notify){let ok=false;
    try{if(window.HFNative){ok=(await window.__hfRequestNotificationPermission())==='granted';}
      else if('Notification' in window){ok=(await Notification.requestPermission())==='granted';}}catch(e){}
    if(!ok){toast('Notifications are blocked for this app');return;}
  }
  S.settings.notify=!S.settings.notify;store.set('settings',S.settings);paintSheet();arm();
})();return;
case'reset':if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Tap again to delete everything';return}store.clear();S.profile=null;S.items=[];S.settings={lang:'en-IN',instant:true,notify:false};S.wins={day:dayKey(),count:0};tmpPhoto=null;filter='all';arm();closeSheet();return render();
case'close':return closeCap();
case'typing':hardStop();mode=null;C.typing=!C.typing;C.hint='';return renderCap();
case'sort':{const v=$('#tx').value.trim();if(!v){hint('Type something first.');return}return toReview(v,false)}
case'cycle':{cancelAuto();const it=C.items.find(x=>x.id===id);if(it){it.type=TYPES[(TYPES.indexOf(it.type)+1)%TYPES.length];buzz(5);renderCap()}return}
case'rm':cancelAuto();C.items=C.items.filter(x=>x.id!==id);return renderCap();
case'save':return saveCap();
case'redo':cancelAuto();committed='';C.phase='listen';C.items=[];C.text='';C.hint='';return renderCap()}});
app.addEventListener('pointerdown',e=>{if(C.phase==='review'&&e.target.closest('.card'))cancelAuto();if(!e.target.closest('#bm'))return;e.preventDefault();autoTry=false;pressAt=Date.now();released=false;
if(want&&mode!=='hold'){ignoreUp=true;stop();return}if(want)return;begin('hold')});
const release=()=>{if(!pressAt)return;const held=Date.now()-pressAt;pressAt=0;if(ignoreUp){ignoreUp=false;return}released=true;if(!want)return;if(mode==='hold'){if(held<350){mode='tap';label();buzz(5)}else stop()}};
document.addEventListener('pointerup',release);document.addEventListener('pointercancel',release);
app.addEventListener('contextmenu',e=>{if(e.target.closest('#bm'))e.preventDefault()});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='ag')t.value=t.value.replace(/\D/g,'');if(t.id==='nm'||t.id==='ag'){const er=$('#err');if(er)er.textContent=''}if(t.id==='tx')hint('');
if(t.classList.contains('ct')){const it=C.items.find(x=>x.id===t.dataset.id);if(it)it.title=t.value;cancelAuto()}});
app.addEventListener('focusin',e=>{if(e.target.classList.contains('ct'))cancelAuto()});
app.addEventListener('change',async e=>{const t=e.target;
if(t.id==='ph'&&t.files&&t.files[0]){const p=await readPhoto(t.files[0]);if(p){tmpPhoto=p;$('#php').innerHTML=`<img src="${p}" alt="">`;$('#pht').textContent='Looking good'}}
if(t.id==='ph2'&&t.files&&t.files[0]){const p=await readPhoto(t.files[0]);if(p){S.profile.photo=p;store.set('profile',S.profile);paintSheet();render()}}
if(t.id==='sn'&&t.value.trim()){S.profile.name=t.value.trim();store.set('profile',S.profile);render()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();if(want)stop();return}if(S.profile&&S.settings.instant&&!C.open&&!sheet.classList.contains('show')&&hiddenAt&&Date.now()-hiddenAt>800)openCap('auto')});

if(!window.HFNative && 'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();arm();
setTimeout(()=>{splash.classList.add('hide');setTimeout(()=>splash.remove(),700);if(S.profile&&S.settings.instant)openCap('auto')},1100);
})();
</script>
</body>
</html>
